PRODUCT PROTOTYPE · V1.0
 一键成片 · AI 音乐（素材成曲）
 在「一键成片 - BGM 选择 - AI 音乐」中，用画面素材与一句话提示词生成一段可试听、可下载的 15
 秒背景音乐。
 文档类型：需求原型说明 所属功能：一键成片 BGM 提出方：产品侧 版本：V1.0 状态：待评审

 一、背景与本期目标
一键成片的 BGM 选择本次扩为三个模块：推荐、导入、AI 音乐。推荐与导入的交互已在评审中确认；AI 音乐
原设计包含「素材成曲」和「想法成曲」两种模式。
评审结论是：一期只上「想法成曲」。素材成曲因为外部音乐厂商只开放文本提示词接口、不提供素材分析能
力，无法按原设想实现，本期不进入版本，但需要先做一次本地可行性验证，确认画面信息能否影响音乐生成结
果。
本原型只覆盖这次可行性验证的范围：用户上传一张图片、输入一句提示词，系统本地解析画面并生成一段 15
秒的背景音乐，支持试听与下载，用于判断这条路是否值得继续投入。
项目             说明
验证目标           画面内容 + 文字提示词，能否稳定影响生成的音乐方案与听感
使用场景           品牌宣传片开头、活动图文配乐、产品发布素材垫乐
本期范围           独立单页工具，上传一张图片，生成 15 秒 MP3，仅本地处理，不落个人云、不进入一键
               成片正式链路
本期不做           推荐曲库扩容与搜索、视频提取音乐、本地上传与云盘上传、想法成曲、模型选择列表、
               个人云落库与审核
验收边界           验证结果作为是否立项的输入，不作为线上功能交付
 与评审结论的关系：素材成曲按厂商现有能力无法直接实现，本次验证改由平台本地完成，不依赖外部厂商；结论用于
 回答&quot;这条路要不要继续做&quot;。
二、页面描述
页面 1 · 素材成曲验证台（主页面）
 顶部：功能名「素材成曲 · 可行性验证」，右侧保留「历史记录」入口。
 左侧上传区：点击或拖拽上传一张图片，上传后显示缩略图与画面解析结果。
 左侧提示词区：一句话输入框，下方给出 3 个常用示例标签，点击即可填入。
 右侧方案区：展示音乐方案（风格、BPM、调式、乐器编制、情绪曲线）与「开始生成」按钮。
 底部播放条：生成完成后出现试听、波形示意、时长与「下载 MP3」。
页面 2 · 生成结果
 图片区：原图缩略图，加主色调、明暗、饱和度、画面密度四项解析标签。
 方案区：结构化展示音乐方案，并提供「整段可复制」的英文提示词，供后续接入外部模型时直接使用。
 播放区：内置播放器，可试听、暂停、拖动进度，时长固定 15 秒。
 操作区：「下载 MP3」「换一个」「调整提示词重新生成」。
页面 3 · 历史记录
 列表展示历史图片缩略图、提示词摘要、生成时间，按时间倒序。
 点击任意一条可恢复当时的图片、提示词与音频，支持重新下载。
 最多保留最近 20 条，仅存本机浏览器，不上传。

【客户材料 2】一键成片 BGM 功能 · 需求评审会录音转写
# 一键成片 BGM 功能 · 需求评审会录音转写

会议主题：一键成片 BGM 选择能力升级需求评审
会议时间：2026-10-09 10:00–10:53
参会角色：产品（需求提出方）、平台技术、算法平台、客户端、设计、内容运营
录音时长：53 分钟（以下为整理后的关键段落转写，已按议题归并）

---

## 一、需求背景

**产品 A**：一键成片里现在可以选 BGM，但只有一批固定的推荐曲目，用户拿到一首不合适的音乐只能自己去外面找。这次把 BGM 的选择范围扩成三类：**推荐、导入、AI 音乐**。今天主要评审这三个模块的交互和边界。

**产品 A**：推荐这块还是原来的形态，两个新增点。一是曲库从现在的二十来首扩到 300 首，商务那边已经在走流程了；二是支持搜索，搜索范围先限定在推荐音乐里，关键词跟音乐名称、音乐风格做匹配。后面如果曲目有明确的风格标签，比如适合卡点的，也希望搜得到。

**技术 A**：搜索就是按歌名、歌手、风格来搜？

**产品 A**：对。现在曲目少，先只做搜索。等 300 首进来，如果分类明确了，再考虑在前面加分类筛选。搜索结果页我这边补一版。

---

## 二、导入音乐

**产品 A**：导入音乐下面有三块：**视频提取音乐、本地上传、云盘上传**。

**产品 A**：视频提取的场景是用户手上只有一段带背景音乐的视频，想把里面的音乐抽出来复用。点提取之后进入选素材组件，支持从云盘和本地选视频，**一次只允许选一个**，有大小和时长限制。选完走提取过程，提取完成后回到提取音乐的 Tab，把提取到的音乐列出来，支持勾选播放。

**产品 A**：提取出来的音乐命名规则是&quot;提取音乐 + 年月日 + 序号&quot;，同一天提取多个就从 01 开始排。

**算法 B**：这里要确认一下，提取是不是异步任务？用户在这个页面直接等到提取成功吗？

**产品 A**：我测竞品大概一分钟以内，我们限制在五分钟以内、200 兆以内的视频。

**算法 B**：剪映算力足，我们不一定。而且用户选本地文件，前端还得先把文件传上去。**建议做异步**——本地文件先传到云盘，我们拿到云盘 ID 再去处理。

**产品 A**：那本地文件传到临时空间，提取完再处理？

**算法 B**：为什么传临时空间？素材和结果最后都要落到云盘，输入直接传云盘就行，最大 200 兆本来也得走上传。

**产品 A**：可以，那就改成异步，素材直接上传到指定目录。

**客户端 A**：异步的话页面怎么知道提取完成？

**算法 B**：要么轮询，要么用户退出后回来查列表。给他建任务的时候返回一个 task ID，按任务状态轮询就行。结果页没必要一直轮询，用户刷新或者重进来看状态。

**产品 A**：那我在上传和提取各加一个 loading 状态。

**客户端 A**：我们评估一下能不能做到一分钟以内，如果能，实时对用户更友好。

**产品 A**：我也倾向实时。你们评估下三分钟、100 兆以内能否做到一分钟内返回，我测竞品是这个水平。但如果做不到，就按异步走。

**产品 A**：提取失败要有明确提示，失败态我补上。视频格式沿用 AI 视频那套限制，后台支持什么就限什么，不支持的直接报失败。

**产品 A**：本地上传这块，安卓是列出本地所有音频文件；iOS 引导用户从系统文件导入，已选过的文件在没清缓存时可以展示，重装或者清缓存之后就没了，这个限制要在原型里写清楚。

**客户端 B**：排序这里，按时间/按名字是一个维度，正序降序是另一个维度，原型上只画了一个维度，交互没体现清楚，补一下。

**产品 A**：行，个人云和笔记里导入音频的排序交互是现成的，我照那个补上。

**算法 B**：另外提一句，从视频里提取音乐，用户提取的是什么音乐我们控制不了，**版权问题要跟运维确认**。

**产品 A**：记下来，会后跟运维确认。

---

## 三、AI 音乐

**产品 A**：AI 音乐这块原设计是两种模式：**素材成曲**和**想法成曲**。素材成曲是拿一键成片里已经选的图片、视频素材去分析，生成音乐；想法成曲是用户直接输入想法和歌词。

**算法 B**：素材成曲这里我要泼个冷水。我们对接的厂商能力里只有生成歌词，**没有素材分析接口**，能力只支持把文本提示词传过去。素材我们传不过去，也就没法保证效果。

**产品 A**：我之前看接口，厂家那边确实只有生成歌词，没有素材分析。

**算法 B**：所以素材成曲这个模式，按厂商现在的能力做不了。建议**按厂商能力来**，厂商有什么能力我们给什么能力。

**产品 A**：那本期是不是就只保留想法成曲？

**产品 A**：可以。素材成曲先不上一期版本，但我想先在平台侧**做一次可行性验证**，看这条路到底能不能走通，能走通再谈排期。

**产品 A**：想法成曲是用户输入提示词，人声歌曲可以再输入歌词，不输入就由厂商自动生成歌词；纯音乐模式没有歌词这一项。

**产品 A**：模型这边现在只对接了火山，所以模型选择先预列一项。如果后面阿里也有同样的能力，这里就是返回一个模型列表，用户可选。

**算法 B**：那这里返回一个模型列表就行，只是现在列表里只有一个。

**客户端 A**：生成这个过程要不要也做成异步？我听下来生成一首两分钟的要两三分钟。

**产品 A**：做成异步，参考现在 AI 视频那套。生成中显示一个待完成的状态，完成后回到列表。

**客户端 A**：生成中的时候名称显示什么？名字不是要生成完才有吗。

**产品 A**：生成中先用模糊占位，完成后回填。任务创建的时候后台要立刻返回一条记录，包含生成状态，不然列表是空的。

**产品 A**：生成记录列表要有选中状态和&quot;选择音乐&quot;按钮。生成完成不默认选中，用户勾选之后才能应用到当前的成片里。

**产品 A**：勾选之后要能试听。现在的逻辑是点一下先把云端文件下到本地，下载完成再播放，切换下一首也是一样，**中间要有 loading**。

**客户端 B**：那下载失败怎么办？

**产品 A**：下载失败就不切歌，保持原来那首在播，给一个提示。异常场景我补一版用例。

**产品 A**：封面这块，生成结果的接口不会带封面，列表要么算法给一张，要么让设计出一个默认 icon。先定用默认 icon。

---

## 四、落库、审核与其他

**产品 A**：生成的歌曲要上传到个人云的指定目录，路径我标红写清楚，输入素材和提取结果也都放这个目录。

**算法 B**：生成的音乐要不要送审？以前都是有审核的。

**产品 A**：沿用个人云文件现有的审核机制就行。

**产品 B**：对，生成完上传到个人云，按个人云那套机制走。

**产品 A**：生成记录列表是从这个目录列举吗？会不会用户自己往里放音乐，也被列出来？

**客户端 B**：这个要确认。像 AI 视频的作品完成页，是直接读算法或者读表的，不是遍历目录。生成记录应该只显示用户自己生成的作品，不包含手工放进去的文件。

**产品 A**：这块我按读生成记录表来做，封面、名称、时长三项，其他工具信息不用显示。

**产品 A**：这个需求纳入 10 月底版本，**16 号提测**。麻烦跟进一下高保时间和排期，我在群里同步。

**算法 B**：16 号提测时间很紧，工作量不小，先评一下。

**产品 A**：原型修订记录和低保稿我按今天说的点统一改一版，改完在群里同步。

---

## 会议结论（会后待办）

1. BGM 选择扩为三个模块：推荐、导入、AI 音乐。
2. 推荐：曲库扩到 300 首，支持按关键词匹配歌名与风格；搜索结果页待补。
3. 导入：支持视频提取音乐、本地上传、云盘上传；视频提取按异步任务设计，素材与结果统一落到个人云指定目录，补充上传/提取 loading 与失败态。

    <div class="row">
      <button onclick="run()">生成结果</button>
      <button class="ghost" onclick="loadSample()">填入示例</button>
      <button class="ghost" onclick="clr()">清空</button>

    <div class="status" id="status">就绪</div>
  </div>
  <div class="card" id="out"><span class="sub">结果会显示在这里。</span></div>
</div>
<script>
var SAMPLE = '客户希望把会议录音上传到云盘后自动生成纪要并提取待办。纪要包含会议摘要、关键决议、待办事项。待办需要负责人和截止时间，是否自动识别负责人待确认。验收标准：30 分钟内出初稿，字段完整率不低于 90%。';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function split(raw){return raw.split(/[。；;\r\n]/).map(function(s){return s.trim()}).filter(Boolean)}
function pick(parts,re){return parts.filter(function(l){return re.test(l)})}
function section(title,items){return '<h3>'+esc(title)+'</h3>'+(items.length?'<ul>'+items.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul>':'<p><span class="sub">未识别到内容</span></p>')}
function clr(){document.getElementById('src').value='';document.getElementById('out').innerHTML='<span class="sub">结果会显示在这里。</span>';setStatus('就绪')}
function loadSample(){document.getElementById('src').value=SAMPLE;setStatus('已填入示例材料')}
function setStatus(t){document.getElementById('status').textContent=t}
function run(){
  var raw=(document.getElementById('src').value||'').trim();
  if(!raw){setStatus('请先粘贴材料');return}
  var parts=split(raw);
  setStatus('已解析 '+parts.length+' 条要点');
  var summary=parts.slice().sort(function(a,b){return b.length-a.length}).slice(0,2);
  var decisions=pick(parts,/(决定|确认|通过|达成|结论)/);
  var todos=pick(parts,/(需要|待办|跟进|补充|输出|完成|安排)/);
  var open=pick(parts,/([?？]|是否|待确认)/);
  document.getElementById('out').innerHTML=
    '<h3>会议摘要</h3><p>'+esc(summary.join('；')||'未识别到摘要')+'</p>'+
    section('关键决议',decisions)+
    section('待办事项',todos)+
    section('待确认问题',open)+
    '<div class="status">共 '+parts.length+' 条要点，'+decisions.length+' 条决议，'+todos.length+' 条待办</div>';
}
if(document.getElementById('src').value.trim())run();
</script>
